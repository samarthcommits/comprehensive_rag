[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "my_project"
version = "0.1.0"

[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = ["tests*", "docs*", "examples*"]

[tool.setuptools.package-data]
# Include non-Python files if needed; adjust patterns as required.
# "your_package_name" = ["py.typed", "**/*.txt", "**/*.json", "**/*.yaml"]